name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore FleetGraph.slnx
      - run: dotnet build FleetGraph.slnx -c Release --no-restore
      - run: dotnet test FleetGraph.slnx -c Release --no-build --logger "trx" --results-directory TestResults
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  # Schema governance: drift, composition and breaking-change checks.
  schema-governance:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore

      - name: Export source schemas
        run: ./scripts/export-schemas.sh

      - name: Schema drift check (exported == committed)
        run: |
          if [ -n "$(git status --porcelain -- '**/schema.graphqls')" ]; then
            git --no-pager diff -- '**/schema.graphqls' || true
            echo "::error::The exported schema differs from the committed schema.graphqls. Run ./scripts/export-schemas.sh and commit."
            exit 1
          fi

      - name: Composition check
        run: |
          dotnet nitro fusion compose \
            --source-schema-file src/Vehicles/FleetGraph.Vehicles.Api/schema.graphqls \
            --source-schema-file src/Service/FleetGraph.Service.Api/schema.graphqls \
            --source-schema-file src/Parts/FleetGraph.Parts.Api/schema.graphqls \
            --archive gateway.far \
            --environment Docker

      - name: Breaking change check (GraphQL Inspector vs. base branch)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') }}
        run: |
          status=0
          for s in Vehicles Service Parts; do
            file="src/$s/FleetGraph.$s.Api/schema.graphqls"
            if ! git cat-file -e "$BASE_REF:$file" 2>/dev/null; then
              echo "No $file on base branch, skipping (new subgraph)."
              continue
            fi
            git show "$BASE_REF:$file" > "/tmp/$s.base.graphqls"
            echo "==> $s"
            # Removing a field that was already @deprecated is allowed (see docs/adr/0003).
            npx --yes @graphql-inspector/cli@5 diff "/tmp/$s.base.graphqls" "$file" \
              --rule suppressRemovalOfDeprecatedField || status=1
          done
          if [ "$status" -ne 0 ]; then
            if [ "$ALLOW_BREAKING" = "true" ]; then
              echo "::warning::Breaking schema changes approved via the 'breaking-change-approved' label."
            else
              echo "::error::Breaking schema changes detected. Deprecate first (docs/adr/0003) or add the 'breaking-change-approved' label."
              exit 1
            fi
          fi

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build all images (also composes the supergraph)
        run: docker compose build
